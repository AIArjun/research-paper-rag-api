name: CI - Demo foundation tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_PROVIDER: demo
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (Docker runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-deploy.txt
          pip install pytest httpx reportlab

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Build the deployed Docker profile
        run: docker build -t rag-foundation-ci .

      - name: Smoke-test Docker demo startup
        run: |
          docker run -d --name rag-foundation-ci -p 18001:8001 -e LLM_PROVIDER=demo rag-foundation-ci
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://localhost:18001/health

      - name: Container logs
        if: failure()
        run: docker logs rag-foundation-ci || true
